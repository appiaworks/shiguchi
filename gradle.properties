# Reuse task outputs from the local cache (on CI, the Gradle User Home that setup-gradle restores
# from the GitHub Actions cache). An unchanged module's compile, test and report tasks are fetched
# instead of re-run.
org.gradle.caching=true
# Run independent modules' tasks concurrently. On a 4-CPU CI runner a full build (no build cache)
# measured 12m27s parallel vs 16m09s serial (#239). An earlier attempt timed out Spring end-to-end
# tests; their WebTestClient response timeout is 30 s since #222.
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
