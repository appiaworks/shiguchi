openapi: 3.0.3
info:
  title: Inventory Service
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - bearer: []
paths:
  /items:
    get:
      operationId: listItems
      tags:
        - Items
      x-audit: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags:
        - Items
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /items/{sku}:
    servers:
      - url: http://override:9090
    get:
      operationId: getItem
      parameters:
        - $ref: "#/components/parameters/SkuParam"
      security:
        - bearer:
            - "read:items"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/SkuParam"
      responses:
        "204":
          description: No Content
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Item:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
    Tag:
      type: object
      properties:
        name:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
  parameters:
    SkuParam:
      name: sku
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
