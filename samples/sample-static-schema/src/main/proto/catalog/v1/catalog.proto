syntax = "proto3";

package sample.catalog.v1;

import "google/api/annotations.proto";

option java_package = "dev.appiaworks.shiguchi.sample.staticschema.proto";
option java_multiple_files = true;

// A catalog of products. Nothing unusual: the point of this sample is *how the gateway learns
// about this service*, not what the service does.
service CatalogService {
  // Fetches one product by SKU.
  rpc GetProduct(GetProductRequest) returns (Product) {
    option (google.api.http) = {get: "/v1/products/{sku}"};
  }
  rpc ListProducts(ListProductsRequest) returns (ProductList) {
    option (google.api.http) = {get: "/v1/products"};
  }
}

message Product {
  string sku = 1;
  string name = 2;
  double price = 3;
}

message ProductList {
  repeated Product products = 1;
}

message GetProductRequest {
  string sku = 1;
}

message ListProductsRequest {}
