syntax = "proto3";

package acme.shop;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/decimal.proto";
import "google/type/money.proto";

option java_multiple_files = true;
option java_package = "com.acme.shop.proto";

// A stock-keeping unit. A message rather than a string so that the type says what it is; on the
// wire and in JSON it is just its code ("AB-1"), through the codec in Codecs.java.
message Sku {
  string code = 1;
}

message Line {
  Sku sku = 1;
  int32 quantity = 2;
  google.type.Decimal unit_weight_kg = 3;
}

message Order {
  string id = 1;
  google.type.Date placed_on = 2;
  google.protobuf.Timestamp paid_at = 3;
  google.type.Money total = 4;
  google.protobuf.Duration delivery_window = 5;
  repeated Line lines = 6;
}
