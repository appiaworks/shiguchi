site_name: Shiguchi
site_description: REST, GraphQL, OpenAPI and push messaging in front of any gRPC service.
site_url: https://appiaworks.github.io/shiguchi/
repo_url: https://github.com/appiaworks/shiguchi
repo_name: appiaworks/shiguchi
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  hooks/
strict: true

theme:
  name: material
  logo: brand/shiguchi-mark.svg
  favicon: brand/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

# The docs link to files outside docs/ (SECURITY.md, samples, benchmarks); the hook points
# those at the repository on GitHub, so the Markdown stays readable on GitHub and on the site.
hooks:
  - docs/hooks/repo_links.py

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - redirects:
      redirect_maps:
        api-compatibility.md: operations/api-compatibility.md
        avro.md: guides/avro.md
        bff.md: guides/bff/index.md
        guides/bff.md: guides/bff/index.md
        caching.md: guides/caching.md
        comparison.md: concepts/comparison.md
        configuration.md: reference/configuration.md
        deployment.md: operations/deployment.md
        error-handling.md: guides/error-handling.md
        graphql-annotations.md: guides/graphql-annotations.md
        grpc-web.md: guides/grpc-web.md
        http-annotations.md: guides/http-annotations.md
        json-types.md: guides/json-types.md
        merging.md: guides/merging.md
        observability.md: operations/observability.md
        performance.md: concepts/performance.md
        projections-paging-sorting.md: guides/projections/index.md
        guides/projections-paging-sorting.md: guides/projections/index.md
        proto-serde-standalone.md: libraries/proto-serde-standalone.md
        protoc-java-extras.md: libraries/protoc-java-extras.md
        push-cli.md: reference/push-cli.md
        push.md: guides/cursus/index.md
        guides/push.md: guides/cursus/index.md
        rate-limiting.md: guides/rate-limiting.md
        resilience.md: guides/resilience.md
        security.md: guides/security.md
        service-discovery.md: guides/service-discovery.md
        transcoding.md: concepts/transcoding.md
        troubleshooting.md: operations/troubleshooting.md
        tutorial.md: getting-started/tutorial.md
        ui.md: guides/ui.md
        validation.md: guides/validation.md

nav:
  - Home: README.md
  - Getting started:
      - Quick start: getting-started/quick-start.md
      - Features: getting-started/features.md
      - Compatibility: operations/compatibility.md
      - Tutorial: getting-started/tutorial.md
      - Configuration: reference/configuration.md
      - Comparison: concepts/comparison.md
      - Troubleshooting: operations/troubleshooting.md
  - Shaping the API:
      - REST (google.api.http): guides/http-annotations.md
      - GraphQL and shiguchi options: guides/graphql-annotations.md
      - Transcoding: concepts/transcoding.md
      - JSON types: guides/json-types.md
      - Projections, paging, sorting:
          - Overview: guides/projections/index.md
          - Paging: guides/projections/paging.md
          - Sorting: guides/projections/sorting.md
          - Field projection: guides/projections/field-projection.md
          - JPA example: guides/projections/jpa-example.md
      - Merging backends: guides/merging.md
      - Error handling: guides/error-handling.md
      - Validation: guides/validation.md
  - Other client surfaces:
      - gRPC-Web: guides/grpc-web.md
      - Avro: guides/avro.md
      - Console: guides/ui.md
  - Backends and traffic:
      - Service discovery: guides/service-discovery.md
      - Resilience: guides/resilience.md
      - Caching: guides/caching.md
      - Rate limiting: guides/rate-limiting.md
  - Security:
      - Security: guides/security.md
      - BFF:
          - Overview: guides/bff/index.md
          - Endpoints, refresh, logout: guides/bff/endpoints.md
          - Push with the cookie: guides/bff/push-with-cookie.md
          - Threat model: guides/bff/threat-model.md
          - Deployment and migrating: guides/bff/migrating.md
  - Push messaging (Cursus):
      - Cursus:
          - Overview: guides/cursus/index.md
          - Subscribing: guides/cursus/subscribing.md
          - Publishing: guides/cursus/publishing.md
          - Topics, sources, hooks: guides/cursus/topics-and-sources.md
          - Delivery and sessions: guides/cursus/delivery.md
          - Authorization: guides/cursus/authorization.md
          - Operations: guides/cursus/operations.md
          - Engines: guides/cursus/engines.md
          - Configuration: guides/cursus/configuration.md
      - Command line: reference/push-cli.md
  - Running in production:
      - Deployment: operations/deployment.md
      - Observability: operations/observability.md
      - Performance: concepts/performance.md
  - Libraries without the gateway:
      - protobuf-java-extras: libraries/proto-serde-standalone.md
      - protoc-java-extras: libraries/protoc-java-extras.md
      - API compatibility: operations/api-compatibility.md
  - Design notes:
      - Cursus: design/push.md
      - BFF: design/bff.md
      - GraphQL live queries: design/graphql-live.md
  - About:
      - Brand: brand/README.md
