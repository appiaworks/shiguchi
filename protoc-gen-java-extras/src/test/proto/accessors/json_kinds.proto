// Every kind of field the generated writeJson has to handle, in proto3.
syntax = "proto3";

package accessors;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/type/date.proto";
import "google/type/dayofweek.proto";

option java_multiple_files = true;
option java_package = "dev.appiaworks.protobuf.extras.protoc.fixture.proto";

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_SMALL = 1;
  KIND_LARGE = 2;
}

message Part {
  string name = 1;
  int64 weight = 2;
  Kind kind = 3;
}

message Kinds {
  message Inner {
    enum Level {
      LEVEL_UNSPECIFIED = 0;
      LEVEL_HIGH = 1;
    }
    Level level = 1;
    repeated Part parts = 2;
  }

  double a_double = 1;
  float a_float = 2;
  int32 an_int32 = 3;
  int64 an_int64 = 4;
  uint32 a_uint32 = 5;
  uint64 a_uint64 = 6;
  sint32 a_sint32 = 7;
  sint64 a_sint64 = 8;
  fixed32 a_fixed32 = 9;
  fixed64 a_fixed64 = 10;
  sfixed32 a_sfixed32 = 11;
  sfixed64 a_sfixed64 = 12;
  bool a_bool = 13;
  string a_string = 14;
  bytes some_bytes = 15;
  Kind kind = 16;
  Part part = 17;
  Inner inner = 18;
  google.protobuf.Timestamp at = 19;
  google.type.Date on = 20;
  google.type.DayOfWeek weekday = 21;
  google.protobuf.Int64Value points = 22;
  google.protobuf.Struct attributes = 23;

  repeated int32 int32s = 30;
  repeated int64 int64s = 31;
  repeated uint64 uint64s = 32;
  repeated string strings = 33;
  repeated bytes byte_strings = 34;
  repeated Kind kinds = 35;
  repeated Part parts = 36;
  repeated google.type.Date days = 37;
  repeated bool bools = 38;
  repeated double doubles = 39;

  map<string, string> labels = 40;
  map<int32, int64> int_by_int = 41;
  map<uint32, Part> part_by_uint32 = 42;
  map<uint64, string> name_by_uint64 = 43;
  map<bool, Kind> kind_by_bool = 44;
  map<int64, google.protobuf.Timestamp> at_by_int64 = 45;
  map<string, bytes> bytes_by_name = 46;
  map<sint32, double> double_by_sint32 = 47;
  map<fixed64, float> float_by_fixed64 = 48;

  oneof choice {
    string choice_text = 50;
    int32 choice_number = 51;
    Part choice_part = 52;
  }

  optional string maybe = 60;
  optional int32 maybe_number = 61;

  // Names protoc alters: a reserved one, and one that camel-cases to a method every message has.
  string class = 70;
  string serialized_size = 71;
  string line_2x_date = 72;
}

message WithAny {
  string name = 1;
  google.protobuf.Any payload = 2;
}

message ReachesAny {
  WithAny inner = 1;
}
