apiVersion: v1
kind: Service
metadata:
  name: {{ include "shiguchi.fullname" . }}
  labels:
    {{- include "shiguchi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "shiguchi.selectorLabels" . | nindent 4 }}
---
{{- if .Values.grpcService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shiguchi.fullname" . }}-grpc
  labels:
    {{- include "shiguchi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grpcService.type }}
  ports:
    - port: {{ .Values.grpcService.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "shiguchi.selectorLabels" . | nindent 4 }}
{{- end }}