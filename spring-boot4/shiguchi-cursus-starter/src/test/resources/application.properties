# The POSTGRES engine's test dependencies put Boot's R2DBC auto-configuration on every test
# context's classpath, and it refuses to start without a URL. This one is never connected to
# (the pool is lazy); PushPostgresEndToEndTest replaces it with its embedded database's.
spring.r2dbc.url=r2dbc:postgresql://localhost:1/unused
spring.r2dbc.username=unused
