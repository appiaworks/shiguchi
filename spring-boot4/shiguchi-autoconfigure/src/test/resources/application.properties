# Consul is on the test classpath only for ConsulGrpcPortAutoConfigurationTest; keep its own
# auto-registration out of the Boot end-to-end tests (two AutoServiceRegistration beans otherwise).
spring.cloud.consul.enabled=false
# Same for Spring Boot gRPC server, on the test classpath only for the port-detection tests: its
# auto-configured server would clash with the end-to-end tests own gRPC servers.
spring.grpc.server.enabled=false
