# PushBenchmark's POSTGRES engine puts Boot's R2DBC auto-configuration on the benchmark classpath,
# and it refuses to start a gateway without a URL. This one is never connected to (the pool is
# lazy); the POSTGRES trials set their embedded database's URL explicitly.
spring.r2dbc.url=r2dbc:postgresql://localhost:1/unused
spring.r2dbc.username=unused
