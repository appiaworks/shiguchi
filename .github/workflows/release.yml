name: GitHub Release

# Creates a GitHub Release with auto-generated notes when a version tag is pushed.
# Note categories are configured in .github/release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ci.yml's attach step may have created the release first; that is fine.
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 ||
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
