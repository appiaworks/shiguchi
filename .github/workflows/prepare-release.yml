# Opens the release PR: versions, doc pins and the changelog date, from prepare-release.py.
#
# Dispatch it from main whatever the base: the workflow and the script come from the dispatched ref,
# the tree they edit comes from `base`.
#
# The branch and the PR use the release bot App's token, so the PR runs CI like anyone else's. With
# GITHUB_TOKEN its CI runs wait for a manual approval, and the PR can't merge until they've passed.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, x.y.z"
        required: true
        type: string
      base:
        description: "Branch to release from: main, or release/x.y.x for a patch"
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  prepare:
    name: Open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      BASE: ${{ inputs.base }}
      # The secrets context isn't available to a step's if.
      HAS_BOT_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Get the release bot's token
        id: bot
        if: env.HAS_BOT_KEY == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when the bot isn't configured
        if: env.HAS_BOT_KEY != 'true'
        run: echo "::warning::RELEASE_BOT_PRIVATE_KEY isn't set. The release PR's CI will wait for a manual approval."

      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false

      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tree
          ref: ${{ inputs.base }}
          token: ${{ steps.bot.outputs.token || github.token }}

      - name: Edit versions, pins and changelog
        working-directory: tree
        run: python3 ../tools/.github/scripts/prepare-release.py "$VERSION"

      - name: Push the branch
        id: branch
        working-directory: tree
        run: |
          if git diff --quiet; then
            echo "::error::$BASE is already at $VERSION: there is nothing to release."
            exit 1
          fi
          BRANCH="chore/release-$VERSION"
          if [ -n "$(git ls-remote --heads origin "refs/heads/$BRANCH")" ]; then
            echo "::error::$BRANCH already exists. Close its PR and delete the branch to prepare it again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "chore(release): $VERSION"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        working-directory: tree
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" \
            --title "chore(release): $VERSION" \
            --body "Prepared by the Prepare release workflow. Review the changelog, merge, then push tag \`v$VERSION\` on the merge commit."
