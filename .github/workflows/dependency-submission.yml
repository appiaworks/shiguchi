name: Dependency Submission

# Submits the resolved Gradle dependency graph to GitHub's dependency API so
# Dependabot alerts and the dependency graph cover transitive dependencies.
# Weekly and on demand rather than per merge: the graph only changes when
# gradle/libs.versions.toml does, so a per-merge submission re-submits the same
# graph almost every time.
on:
  schedule:
    - cron: "30 4 * * 1" # weekly, Monday 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    # Bounds a hung job. Resolving every configuration takes a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
