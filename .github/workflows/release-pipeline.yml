name: Release pipeline

# Everything a release publishes except the npm client, whose trusted publisher is ci.yml.
#
# Tag runs call this file at @main, so a fix to the pipeline reaches a patch release without a
# backport. github.sha and github.ref stay the tag's, so what gets built and the provenance it
# carries still name the tag. Only the logic comes from main. That is why this file may only use
# a Gradle task or repository file that every live release branch has.
#
# Maven Central goes first and helm and the image wait for it, so a Central rejection pushes nothing.
#
# dry_run publishes nothing: Central becomes publishToMavenLocal, helm and the image build without
# a push, the GitHub Release is skipped, and the follow-up job prints its edits instead of opening
# a PR. release-rehearsal.yml runs that mode.
on:
  workflow_call:
    inputs:
      tag:
        description: "The release, as vX.Y.Z. It must match the version in the tree being built."
        required: true
        type: string
      dry_run:
        description: "Publish nothing."
        type: boolean
        default: false
      ref:
        description: "The tree to build. Empty means the commit that triggered the run."
        type: string
        default: ""
      pipeline_ref:
        description: "Where .github/scripts comes from. Tag runs pass main; a rehearsal passes its own commit."
        type: string
        default: main
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      SIGNING_KEY:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: "The release bot GitHub App's key. Without it the follow-up PR's CI waits for a manual approval."
        required: false
    outputs:
      central-published:
        description: "'true' once the Central job succeeded. Set even if helm or the image then fail."
        value: ${{ jobs.publish-central.outputs.published }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shiguchi

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Publish to Maven Central (Sonatype Central Portal). This is the only Maven publish. A real run
  # fails when the secrets are missing; a version already on Central is skipped. Afterwards it
  # creates the GitHub Release: a draft, the cursus fat jar attached, then published (releases are
  # immutable, so the asset must be there before it goes out).
  # ──────────────────────────────────────────────────────────────────────────
  publish-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Bounds a hung job. Signing and uploading every module takes a while.
    timeout-minutes: 45
    permissions:
      contents: write # creates the GitHub Release with the cursus jar
    outputs:
      published: ${{ steps.done.outputs.published }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # After the checkout above, which would clean it away.
      - name: Check out the pipeline's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_ref }}
          path: .pipeline
          sparse-checkout: .github/scripts

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin

      # Read-only, or a rehearsal dispatched from main would write what later builds restore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # A separate step, so the Central credentials are not in a dry run's environment. Without
      # them the build has no Central target, which is a stronger guarantee than an `if`.
      - name: Rehearse the publish
        if: inputs.dry_run
        env:
          TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: .pipeline/.github/scripts/publish-central.sh "$TAG" --dry-run

      - name: Publish and release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: .pipeline/.github/scripts/publish-central.sh "$TAG"

      # The fat jar of the cursus command line, for people who do not use jbang.
      - name: Build the cursus jar
        run: ./gradlew :shiguchi-cursus-cli:shadowJar --no-daemon

      - name: Create the GitHub Release with cursus attached
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .pipeline/.github/scripts/attach-cursus.sh "$TAG"

      # The image's sample build resolves these libraries. A dry run already put them in mavenLocal.
      # Neither step can fail the release: image-jar publishes them itself when they don't arrive.
      - name: Publish libraries to mavenLocal
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: ./gradlew publishToMavenLocal --no-daemon --no-configuration-cache

      # include-hidden-files: upload-artifact skips hidden paths, and this one is under ~/.m2.
      - name: Hand the libraries to the image build
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-local
          path: ~/.m2/repository/io/github/appiaworks
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # Last, so it means the whole job succeeded. ci.yml gates the npm publish on it.
      - name: Record success
        id: done
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # The OCI image from sample-full, on GHCR. One job builds the boot jar, a native job per platform
  # builds and pushes by digest, and the last joins the digests under the release's tag and scans it.
  #
  # The artifacts between them last a day. Re-running one of these jobs later than that needs a
  # re-run of all jobs, which is safe: a version already on Central is skipped.
  # ──────────────────────────────────────────────────────────────────────────
  image-jar:
    name: Build the image's boot jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: publish-central
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "25"
          distribution: temurin

      # Read-only, or a rehearsal dispatched from main would write what later builds restore.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Fetch the libraries from the Central job
        id: libraries
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-local
          path: ~/.m2/repository/io/github/appiaworks

      # The samples are a standalone consumer build that resolves the published
      # io.github.appiaworks:* artifacts from mavenLocal. A failed download can leave part of them
      # behind, so anything but a good download is replaced by a fresh publish.
      - name: Publish libraries to mavenLocal if they did not arrive
        env:
          FETCH: ${{ steps.libraries.outcome }}
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' build.gradle.kts | head -1)
          echo "GATEWAY_VERSION=$VERSION" >> "$GITHUB_ENV"
          LIBRARIES="$HOME/.m2/repository/io/github/appiaworks"
          if [ "$FETCH" = "success" ] && ls "$LIBRARIES/shiguchi-core/$VERSION/"*.pom >/dev/null 2>&1; then
            echo "Using the libraries from the Central job"
          else
            echo "::warning::The libraries did not arrive from the Central job. Publishing them here."
            rm -rf "$LIBRARIES"
            ./gradlew publishToMavenLocal
          fi

      # The samples default to samples/gradle.properties; mavenLocal holds the root project
      # version, so pass that through explicitly.
      - name: Build sample boot jar
        run: ./gradlew -p samples sample-full:bootJar -PgatewayVersion="$GATEWAY_VERSION"

      - name: Assemble Docker build context
        run: |
          JAR="$(ls samples/sample-full/build/libs/*.jar | grep -v -- '-plain.jar' | head -1)"
          echo "Using boot jar: $JAR"
          cp "$JAR" samples/sample-full/app.jar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-jar
          path: samples/sample-full/app.jar
          if-no-files-found: error
          retention-days: 1

  # Native on both platforms. The Dockerfile's training run writes an AOT cache, which is slow under
  # emulation.
  image-leg:
    name: Build OCI Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: image-jar
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-jar
          path: samples/sample-full

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: samples/sample-full
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sample-full,push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          provenance: true # SLSA attestation, so the image records how it was built
          sbom: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::the build reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build & Push OCI Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image-leg
    permissions:
      contents: read
      packages: write
      security-events: write # uploads the Trivy SARIF to code scanning
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/shiguchi/sample-full:${{ inputs.tag }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A dry run pushed nothing, so it can only check that both platforms reported a digest.
      - name: Join the platforms under the tag
        working-directory: ${{ runner.temp }}/digests
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/sample-full
        run: |
          COUNT=$(ls | wc -l)
          [ "$COUNT" = "2" ] || { echo "::error::expected 2 platform digests, found $COUNT"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would join $(ls | tr '\n' ' ')as $IMAGE"
            exit 0
          fi
          # shellcheck disable=SC2046 # one word per digest
          docker buildx imagetools create -t "$IMAGE" $(printf "$REPOSITORY@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE"

      # A second, standalone SBOM in SPDX form, attached to the workflow run. The one buildx
      # attaches travels with the image for anything that reads attestations; this one is for a
      # human (or an auditor) who just wants the file.
      - name: Generate SBOM (SPDX)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true # diagnostics only: a full artifact quota must not fail the job (and skip publishing)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: sample-full-sbom.spdx.json
          # The action also attaches the file to the tag's GitHub Release when one exists, which
          # this job's token may not do: v0.7.0 failed here with "Resource not accessible by
          # integration" — after the image was pushed — and the scan below was skipped. Earlier
          # tags passed only because their Release did not exist yet at this point.
          upload-release-assets: false

      # Scans the image that was just pushed, so a dry run has nothing to scan. Reports only: a
      # CVE published in a base image hours before a release should be visible in the run, not a
      # reason the release fails with nothing the author can do about it.
      #
      # The findings are printed in the job log and uploaded as SARIF, so they also show in the
      # repository's Security tab (code scanning).
      #
      # exit-code only covers findings. Trivy can still fail on its own, as on v0.16.1 when its
      # vulnerability DB download returned a 404, so all three steps also continue on error.
      - name: Scan image for vulnerabilities
        if: ${{ !inputs.dry_run }}
        continue-on-error: true # the image is already pushed: a failed report must not fail the job
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # report, never block a release
          ignore-unfixed: true # a CVE with no fix available is not an action item

      - name: Scan image for vulnerabilities (SARIF, for code scanning)
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true # as above
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload scan results to code scanning
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true # as above; there is no file to upload if the SARIF scan failed
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # ──────────────────────────────────────────────────────────────────────────
  # Package the Helm chart and push it to the GHCR OCI registry
  # ──────────────────────────────────────────────────────────────────────────
  helm:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: publish-central
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR (Helm OCI)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: Set chart version from tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"   # strip leading 'v'
          sed -i "s/^version:.*/version: ${VERSION}/" helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" helm/Chart.yaml

      - name: Package Helm chart
        run: helm package helm/ --destination /tmp/helm-pkg

      - name: Push chart to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          CHART_FILE=$(ls /tmp/helm-pkg/*.tgz)
          helm push "${CHART_FILE}" oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/charts

  # ──────────────────────────────────────────────────────────────────────────
  # What the release leaves behind, once its POM is on Maven Central: for a minor, release/x.y.x and
  # the apiBaseline PR; for a patch, the PR that syncs its changelog and pins to main. It needs only
  # Central, so a helm or image failure doesn't hold it back. Running it again is safe.
  #
  # Every permission here must also be on ci.yml's release and pipeline-check jobs, on the release
  # job of each live release branch, and on the rehearsal's rehearse job.
  # ──────────────────────────────────────────────────────────────────────────
  post-release:
    name: Post-release follow-ups
    runs-on: ubuntu-latest
    # The script gives Central 60 minutes.
    timeout-minutes: 75
    needs: publish-central
    permissions:
      contents: write
      pull-requests: write
    env:
      # The secrets context isn't available to a step's if.
      HAS_BOT_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}

    steps:
      - name: Check out the pipeline's scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_ref }}
          path: .pipeline
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Before the token exists: it lasts an hour, and this wait can too.
      - name: Wait for Maven Central
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
        run: python3 "$GITHUB_WORKSPACE/.pipeline/.github/scripts/post-release.py" "$TAG" --wait-only

      # A PR opened with GITHUB_TOKEN holds its CI runs for a manual approval. One opened with an
      # App's token runs CI like anyone else's.
      - name: Get the release bot's token
        id: bot
        if: ${{ !inputs.dry_run && env.HAS_BOT_KEY == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when the bot isn't configured
        if: ${{ !inputs.dry_run && env.HAS_BOT_KEY != 'true' }}
        run: echo "::warning::RELEASE_BOT_PRIVATE_KEY isn't set. The follow-up PR's CI will wait for a manual approval."

      # The edits go on main, whichever tree was released. The push has to use the bot's token too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-tree
          token: ${{ steps.bot.outputs.token || github.token }}
          persist-credentials: ${{ !inputs.dry_run }}

      - name: Open the follow-up PR
        working-directory: main-tree
        env:
          GH_TOKEN: ${{ !inputs.dry_run && (steps.bot.outputs.token || secrets.GITHUB_TOKEN) || '' }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.ref || github.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 "$GITHUB_WORKSPACE/.pipeline/.github/scripts/post-release.py" "$TAG" --source "$SOURCE" "${args[@]}"
