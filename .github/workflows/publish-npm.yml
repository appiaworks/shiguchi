name: Publish npm client

# Manual re-publish of @appiaworks/shiguchi-cursus-client for a release tag that is already
# out, for when the tag run's publish-npm job did not run (it needs the pipeline's Central job, so
# a failure there skips it). Re-running the tag run does not help once Central has the version:
# a step after the Maven publish can keep failing. This checks out the tag and runs the same
# script, which fails on a package.json/tag mismatch and skips a version already on the registry.
# Authenticates by npm trusted publishing: this file is one of the package's trusted publishers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.14.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish cursus client to npmjs.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Publish to npmjs.com
        env:
          TAG: ${{ inputs.tag }}
        run: .github/scripts/publish-cursus-client.sh "$TAG"
