<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">Request flow</title><desc id="d">A REST request is authenticated, routed, converted to protobuf, sent to the gRPC backend, and the response converted back to JSON.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E5D2C"/></marker></defs><rect width="800" height="340" fill="#ffffff"/><rect x="40" y="10" width="140" height="34" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="110" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Client</text><line x1="110" y1="44" x2="110" y2="330" stroke="#8E5D2C" stroke-opacity=".5" stroke-dasharray="4 4"/><rect x="330" y="10" width="140" height="34" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="400" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Shiguchi</text><line x1="400" y1="44" x2="400" y2="330" stroke="#8E5D2C" stroke-opacity=".5" stroke-dasharray="4 4"/><rect x="620" y="10" width="140" height="34" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="690" y="32" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">gRPC backend</text><line x1="690" y1="44" x2="690" y2="330" stroke="#8E5D2C" stroke-opacity=".5" stroke-dasharray="4 4"/><line x1="110" y1="80" x2="398" y2="80" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><text x="254.0" y="73" text-anchor="middle" font-size="12" fill="#2b2118">GET /v1/books?pageSize=2</text><rect x="408" y="101" width="190" height="28" rx="6" fill="#fbf8f3" stroke="#D9573E"/><text x="503" y="119" text-anchor="middle" font-size="12" fill="#2b2118">auth edge · route lookup</text><rect x="408" y="136" width="190" height="28" rx="6" fill="#fbf8f3" stroke="#D9573E"/><text x="503" y="154" text-anchor="middle" font-size="12" fill="#2b2118">JSON / query → protobuf</text><line x1="400" y1="195" x2="688" y2="195" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><text x="544.0" y="188" text-anchor="middle" font-size="12" fill="#2b2118">ListBooks (gRPC)</text><line x1="690" y1="235" x2="402" y2="235" stroke="#8E5D2C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="546.0" y="228" text-anchor="middle" font-size="12" fill="#2b2118">ListBooksResponse</text><rect x="408" y="256" width="190" height="28" rx="6" fill="#fbf8f3" stroke="#D9573E"/><text x="503" y="274" text-anchor="middle" font-size="12" fill="#2b2118">protobuf → JSON</text><line x1="400" y1="310" x2="112" y2="310" stroke="#8E5D2C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="256.0" y="303" text-anchor="middle" font-size="12" fill="#2b2118">200 application/json</text></svg>
