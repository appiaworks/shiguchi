<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">Shiguchi architecture</title><desc id="d">Clients reach the auth edge and route registry, then serde and the reactive dispatcher, which call gRPC and REST backends; the proxy forwards native gRPC; Cursus push serves streaming clients.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9995A"/></marker></defs><rect width="900" height="450" fill="#14110e"/><rect x="10" y="10" width="220" height="430" rx="12" fill="#1b1612" stroke="#C9995A" stroke-opacity=".35"/><text x="24" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#b8a791">CLIENTS</text><rect x="290" y="10" width="330" height="430" rx="12" fill="#1b1612" stroke="#C9995A" stroke-opacity=".35"/><text x="304" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#b8a791">SHIGUCHI</text><rect x="680" y="10" width="210" height="430" rx="12" fill="#1b1612" stroke="#C9995A" stroke-opacity=".35"/><text x="694" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#b8a791">DOWNSTREAM</text><rect x="25" y="45" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="72.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">REST / JSON</text><rect x="25" y="100" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="116.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">GraphQL</text><text x="120.0" y="135.0" text-anchor="middle" font-size="11" fill="#b8a791">queries · subscriptions · @live</text><rect x="25" y="155" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">OpenAPI / Swagger UI</text><rect x="25" y="210" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="237.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">gRPC web console</text><rect x="25" y="265" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Streaming clients</text><text x="120.0" y="300.0" text-anchor="middle" font-size="11" fill="#b8a791">NDJSON · SSE · WS · gRPC-Web</text><rect x="25" y="320" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Browsers</text><text x="120.0" y="355.0" text-anchor="middle" font-size="11" fill="#b8a791">BFF session cookie</text><rect x="25" y="375" width="190" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="120.0" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">gRPC clients</text><rect x="305" y="45" width="300" height="44" rx="8" fill="#241d17" stroke="#ef7a62" stroke-width="1.5" stroke-dasharray="5 4"/><text x="455.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Auth edge</text><text x="455.0" y="80.0" text-anchor="middle" font-size="11" fill="#b8a791">JWT · BFF sign-in · authorizer SPI</text><rect x="305" y="100" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="116.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Route registry</text><text x="455.0" y="135.0" text-anchor="middle" font-size="11" fill="#b8a791">google.api.http + gql annotations</text><rect x="305" y="155" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="171.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Tiered dynamic serde</text><text x="455.0" y="190.0" text-anchor="middle" font-size="11" fill="#b8a791">wire / proto ⇄ JSON / Map</text><rect x="305" y="210" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="226.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Reactive dispatcher</text><text x="455.0" y="245.0" text-anchor="middle" font-size="11" fill="#b8a791">non-blocking, flow-controlled</text><rect x="305" y="265" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Cursus push</text><text x="455.0" y="300.0" text-anchor="middle" font-size="11" fill="#b8a791">topics · fan-out · replay</text><rect x="305" y="320" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Schema discovery</text><text x="455.0" y="355.0" text-anchor="middle" font-size="11" fill="#b8a791">reflection · classpath · .pb · OpenAPI</text><rect x="305" y="375" width="300" height="44" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="455.0" y="391.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">Transparent gRPC proxy</text><text x="455.0" y="410.0" text-anchor="middle" font-size="11" fill="#b8a791">native port + merged reflection</text><rect x="695" y="100" width="180" height="52" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="785.0" y="131.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">gRPC backends</text><rect x="695" y="180" width="180" height="52" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="785.0" y="200.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">REST backends</text><text x="785.0" y="219.0" text-anchor="middle" font-size="11" fill="#b8a791">Avro payloads</text><rect x="695" y="260" width="180" height="52" rx="8" fill="#241d17" stroke="#C9995A" stroke-width="1.5"/><text x="785.0" y="280.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f1e8dc">REST backends</text><text x="785.0" y="299.0" text-anchor="middle" font-size="11" fill="#b8a791">JSON payloads</text><line x1="215" y1="67" x2="305" y2="122" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="122" x2="305" y2="122" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="177" x2="305" y2="122" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="232" x2="305" y2="122" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="287" x2="305" y2="122" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="342" x2="305" y2="67" stroke="#C9995A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="215" y1="397" x2="305" y2="397" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="305" y1="287" x2="215" y2="287" stroke="#C9995A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="455" y1="89" x2="455" y2="100" stroke="#C9995A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="455" y1="144" x2="455" y2="155" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="455" y1="199" x2="455" y2="210" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="126" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="206" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="286" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="397" x2="695" y2="134" stroke="#C9995A" stroke-width="1.5" marker-end="url(#a)"/></svg>
