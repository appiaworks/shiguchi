<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title id="t">Shiguchi architecture</title><desc id="d">Clients reach the auth edge and route registry, then serde and the reactive dispatcher, which call gRPC and REST backends; the proxy forwards native gRPC; Cursus push serves streaming clients.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E5D2C"/></marker></defs><rect width="900" height="450" fill="#ffffff"/><rect x="10" y="10" width="220" height="430" rx="12" fill="#fbf8f3" stroke="#8E5D2C" stroke-opacity=".35"/><text x="24" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#6b5a48">CLIENTS</text><rect x="290" y="10" width="330" height="430" rx="12" fill="#fbf8f3" stroke="#8E5D2C" stroke-opacity=".35"/><text x="304" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#6b5a48">SHIGUCHI</text><rect x="680" y="10" width="210" height="430" rx="12" fill="#fbf8f3" stroke="#8E5D2C" stroke-opacity=".35"/><text x="694" y="32" font-size="12" font-weight="600" letter-spacing="1" fill="#6b5a48">DOWNSTREAM</text><rect x="25" y="45" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="72.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">REST / JSON</text><rect x="25" y="100" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="116.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">GraphQL</text><text x="120.0" y="135.0" text-anchor="middle" font-size="11" fill="#6b5a48">queries · subscriptions · @live</text><rect x="25" y="155" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">OpenAPI / Swagger UI</text><rect x="25" y="210" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="237.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">gRPC web console</text><rect x="25" y="265" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Streaming clients</text><text x="120.0" y="300.0" text-anchor="middle" font-size="11" fill="#6b5a48">NDJSON · SSE · WS · gRPC-Web</text><rect x="25" y="320" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Browsers</text><text x="120.0" y="355.0" text-anchor="middle" font-size="11" fill="#6b5a48">BFF session cookie</text><rect x="25" y="375" width="190" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="120.0" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">gRPC clients</text><rect x="305" y="45" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#D9573E" stroke-width="1.5" stroke-dasharray="5 4"/><text x="455.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Auth edge</text><text x="455.0" y="80.0" text-anchor="middle" font-size="11" fill="#6b5a48">JWT · BFF sign-in · authorizer SPI</text><rect x="305" y="100" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="116.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Route registry</text><text x="455.0" y="135.0" text-anchor="middle" font-size="11" fill="#6b5a48">google.api.http + gql annotations</text><rect x="305" y="155" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="171.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Tiered dynamic serde</text><text x="455.0" y="190.0" text-anchor="middle" font-size="11" fill="#6b5a48">wire / proto ⇄ JSON / Map</text><rect x="305" y="210" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="226.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Reactive dispatcher</text><text x="455.0" y="245.0" text-anchor="middle" font-size="11" fill="#6b5a48">non-blocking, flow-controlled</text><rect x="305" y="265" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Cursus push</text><text x="455.0" y="300.0" text-anchor="middle" font-size="11" fill="#6b5a48">topics · fan-out · replay</text><rect x="305" y="320" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="336.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Schema discovery</text><text x="455.0" y="355.0" text-anchor="middle" font-size="11" fill="#6b5a48">reflection · classpath · .pb · OpenAPI</text><rect x="305" y="375" width="300" height="44" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="455.0" y="391.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">Transparent gRPC proxy</text><text x="455.0" y="410.0" text-anchor="middle" font-size="11" fill="#6b5a48">native port + merged reflection</text><rect x="695" y="100" width="180" height="52" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="785.0" y="131.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">gRPC backends</text><rect x="695" y="180" width="180" height="52" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="785.0" y="200.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">REST backends</text><text x="785.0" y="219.0" text-anchor="middle" font-size="11" fill="#6b5a48">Avro payloads</text><rect x="695" y="260" width="180" height="52" rx="8" fill="#f6f1ea" stroke="#8E5D2C" stroke-width="1.5"/><text x="785.0" y="280.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2b2118">REST backends</text><text x="785.0" y="299.0" text-anchor="middle" font-size="11" fill="#6b5a48">JSON payloads</text><line x1="215" y1="67" x2="305" y2="122" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="122" x2="305" y2="122" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="177" x2="305" y2="122" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="232" x2="305" y2="122" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="287" x2="305" y2="122" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="215" y1="342" x2="305" y2="67" stroke="#8E5D2C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="215" y1="397" x2="305" y2="397" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="305" y1="287" x2="215" y2="287" stroke="#8E5D2C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="455" y1="89" x2="455" y2="100" stroke="#8E5D2C" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="455" y1="144" x2="455" y2="155" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="455" y1="199" x2="455" y2="210" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="126" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="206" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="232" x2="695" y2="286" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/><line x1="605" y1="397" x2="695" y2="134" stroke="#8E5D2C" stroke-width="1.5" marker-end="url(#a)"/></svg>
