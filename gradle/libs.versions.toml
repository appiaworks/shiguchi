[versions]
springBoot        = "3.5.16"
# Boot 4 line: 4.1.x with the SCG 5.0.x train, the pair every Boot 4 end-to-end test runs on.
# (Spring Cloud's compatibility verifier is off by default in Commons 5.0.x, so it does not check
# this pairing.) Bump the two together.
springBoot4       = "4.1.2"
springCloudGateway = "4.3.5"
# SCG 5.x is the Boot 4 line (4.3.x is the Boot 3 line — do not use it for boot4 modules)
springCloudGateway4 = "5.0.4"
grpc              = "1.84.2"
grpcOpenTelemetry = "1.84.0"
protobuf          = "4.36.2"
dgs               = "12.1.0"
dgs10             = "10.6.0"
springdoc         = "3.1.1"
springdoc2        = "2.9.1"
caffeine          = "3.3.0"
classgraph        = "4.8.196"
protovalidate     = "1.3.0"
avro              = "1.12.2"
picocli           = "4.7.7"

lombok            = "1.18.48"
datafaker         = "2.7.0"

[libraries]
# Spring Boot BOMs
spring-boot-bom           = { module = "org.springframework.boot:spring-boot-dependencies",            version.ref = "springBoot" }
spring-boot4-bom          = { module = "org.springframework.boot:spring-boot-dependencies",            version.ref = "springBoot4" }
spring-cloud-gateway-dep  = { module = "org.springframework.cloud:spring-cloud-gateway-dependencies",  version.ref = "springCloudGateway" }
spring-cloud-gateway4-dep = { module = "org.springframework.cloud:spring-cloud-gateway-dependencies",  version.ref = "springCloudGateway4" }
dgs-platform             = { module = "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies", version.ref = "dgs" }
dgs10-platform           = { module = "com.netflix.graphql.dgs:graphql-dgs-platform-dependencies", version.ref = "dgs10" }

# Spring Boot
spring-boot-starter-webflux   = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-security  = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-actuator  = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-autoconfigure     = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-test      = { module = "org.springframework.boot:spring-boot-starter-test" }

# Spring Cloud Gateway
spring-cloud-starter-gateway  = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# gRPC
grpc-services    = { module = "io.grpc:grpc-services",     version.ref = "grpc" }
grpc-util        = { module = "io.grpc:grpc-util",         version.ref = "grpc" }
grpc-stub        = { module = "io.grpc:grpc-stub",         version.ref = "grpc" }
grpc-netty       = { module = "io.grpc:grpc-netty",        version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-inprocess   = { module = "io.grpc:grpc-inprocess",    version.ref = "grpc" }
grpc-protobuf    = { module = "io.grpc:grpc-protobuf",     version.ref = "grpc" }
grpc-otel        = { module = "io.grpc:grpc-opentelemetry", version.ref = "grpcOpenTelemetry" }

# picocli (cursus command line)
picocli         = { module = "info.picocli:picocli",         version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

# Avro (shiguchi-avro)
avro                 = { module = "org.apache.avro:avro", version.ref = "avro" }

# Protobuf
protobuf-java        = { module = "com.google.protobuf:protobuf-java",      version.ref = "protobuf" }
protobuf-java-util   = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
proto-common-protos  = { module = "com.google.api.grpc:proto-google-common-protos", version = "2.77.0" }

# DGS
dgs-spring-graphql         = { module = "com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter" }
dgs-extended-scalars       = { module = "com.netflix.graphql.dgs:graphql-dgs-extended-scalars" }
dgs-micrometer             = { module = "com.netflix.graphql.dgs:graphql-dgs-spring-boot-micrometer" }
dgs-spring-graphql-test    = { module = "com.netflix.graphql.dgs:graphql-dgs-spring-graphql-starter-test" }

# OpenAPI / SpringDoc
springdoc-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
springdoc2-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc2" }

# Serde
caffeine         = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
protovalidate    = { module = "build.buf:protovalidate",                    version.ref = "protovalidate" }
classgraph       = { module = "io.github.classgraph:classgraph",      version.ref = "classgraph" }

# Observability
micrometer-otel   = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
otel-exporter     = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-prom   = { module = "io.micrometer:micrometer-registry-prometheus" }

# Spring / Reactor pieces, for modules that need one type rather than a whole starter.
# Versions come from the Spring Boot BOM each module already imports.
spring-web   = { module = "org.springframework:spring-web" }
reactor-core = { module = "io.projectreactor:reactor-core" }
slf4j-api    = { module = "org.slf4j:slf4j-api" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Test
reactor-test = { module = "io.projectreactor:reactor-test" }
awaitility   = { module = "org.awaitility:awaitility" }
datafaker    = { module = "net.datafaker:datafaker",  version.ref = "datafaker" }

[plugins]
spring-boot    = { id = "org.springframework.boot",   version.ref = "springBoot" }
protobuf-plugin = { id = "com.google.protobuf",        version = "0.10.0" }
shadow         = { id = "com.gradleup.shadow",        version = "9.6.1" }